server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy API-kald til leverance-backenden (samme docker-netværk).
  # Frontenden kalder same-origin /api/jn/... så vi undgår CORS og hardcodede
  # host/port-værdier i browseren.
  location /api/ {
    proxy_pass http://leverance:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Backendens website-ruter (notat-oversigt) og healthcheck.
  location /website/ {
    proxy_pass http://leverance:8000;
    proxy_set_header Host $host;
  }

  location = /healthz {
    proxy_pass http://leverance:8000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
