name: Afhængighedsreview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: false # Deaktiveret, da det ikke fungerer optimalt
    name: Review af nye afhængigheder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC,
            MPL-2.0, Python-2.0, PSF-2.0, Unlicense, CC0-1.0
